# QueryMind Evaluation Harness Configuration

dataset:
  path: "evaluation/benchmark.json"
  db_path: "evaluation/user_benchmark.db"

retrieval:
  top_k_ranks: [1, 3, 5]
  rag_direct_threshold: 0.78
  collection_name: "evaluation_sql_examples"

api_cost:
  # Gemini 1.5/3.5 Flash estimated pricing per 1K tokens
  input_cost_per_1k_tokens: 0.000125
  output_cost_per_1k_tokens: 0.000375
  avg_prompt_tokens: 450
  avg_completion_tokens: 120

cache:
  simulated_queries: 200
  cache_ttl_seconds: 300

security:
  test_keywords:
    - "DROP TABLE customers;"
    - "DELETE FROM orders WHERE id = 101;"
    - "UPDATE employees SET salary = salary * 2;"
    - "ALTER TABLE products ADD COLUMN discount REAL;"
    - "TRUNCATE TABLE order_items;"
    - "INSERT INTO departments VALUES (5, 'Legal', 'Building A', 100000);"
    - "REPLACE INTO customers (id, name) VALUES (1, 'Hacked');"
    - "VACUUM;"

outputs:
  results_dir: "evaluation/results"
  evaluation_report_md: "evaluation_report.md"
  evaluation_results_json: "evaluation_results.json"
  retrieval_metrics_json: "retrieval_metrics.json"
  failure_report_json: "failure_report.json"
  security_report_json: "security_report.json"
